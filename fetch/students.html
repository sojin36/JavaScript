<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: #f5f5f5;
        }
        h1{
            text-align: center;
            margin-top: 50px;
        }
        .container{
            width: 90%;
            max-width: 1200px;
            margin: 100px auto;
            background-color: powderblue;
            padding: 20px;
        }
        .student-list{
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }
        .student-list img{
            width: 100%;
            display: block;
        }
        .card-content{
            padding: 15px;
        }

        /* 모달창 */
        .modal{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            display: none; /* 1. 평소에는 숨김 */
            justify-content: center;
            align-items: center;
        }
        /* 2. show 클래스가 붙었을 때 (띄어쓰기 없음) */
        .modal.show{
            display: flex; /* 중앙 정렬 유지를 위해 flex 사용 */
        }
        .modal-content{
            position: relative;
            width: 500px;
            background-color: #fff;
            padding: 30px;
            border-radius: 10px;
        }
        .close{
            position: absolute;
            right: 20px;
            top: 15px;
            cursor: pointer;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>학생 정보 관리</h1>
    <div class="container">
        <div id="studentList" class="student-list">
            <!-- js출력 -->
        </div>

        <!-- 모달창 -->
        <div class="modal" id="modal">
          <div class="modal-content">
            <div class="close">&times;</div>
            <!-- 학생 상세내용 -->
            <div id="detail">
              <!-- js출력 -->
            </div>
          </div>
        </div> <!-- 3. 불필요한 '>' 제거 완료 -->
    </div>

    <script>
        const studentList = document.querySelector("#studentList")
        const studentDetail = document.querySelector("#detail")
        const modal = document.querySelector("#modal")
        const closeBtn = document.querySelector(".close")

        fetch("students.json")
        .then((res)=>{
            return res.json();
        })
        .then((data)=>{
            studentList.innerHTML = data.map((student)=>{
                return `
                <div class="card">
                <img src="${student.image}" alt="${student.name}">
                <div class="card-content">
                    <h3>이름:${student.name}</h3>
                    <p>${student.major}</p>
                </div>
                </div>   
                `
            }).join("");

            // 카드 클릭시 모달창 (학생 상세 내용)
            const cards = document.querySelectorAll(".card")
            cards.forEach((card, index)=>{
                card.addEventListener("click", ()=>{
                    const student = data[index];

                    studentDetail.innerHTML = `
                    <img src="${student.image}" alt="${student.name}">
                    <div class="card-content">
                        <h2>${student.name}</h2>
                        <p><strong>학생번호:${student.id}</strong></p>
                        <p><strong>전공:${student.major}</strong></p>
                        <p><strong>이메일:${student.email}</strong></p>
                        <p><strong>전화번호:${student.phone}</strong></p>
                    </div>
                    `;
                    modal.classList.add("show");
                });
            })
        })
        .catch((error)=>{
            console.log(error);
        });

        // 모달 닫기 버튼 클릭시
        closeBtn.addEventListener("click", ()=>{
            modal.classList.remove("show")
        })

        // 모달(어두운 배경) 클릭시 닫기
        modal.addEventListener("click", (e)=>{
            if(e.target === modal){
                modal.classList.remove("show")
            }
        })
    </script>
</body>
</html>
