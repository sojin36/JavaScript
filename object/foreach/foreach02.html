<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ul id="fruitList">
        <!-- <li>1.사과</li>
        <li>2.바나나</li>
        <li>3.포도</li>
        <li>1.사과</li> -->
    </ul>
    <script>
        // 더미 데이터
        const list = document.querySelector("#fruitList");
        const fruits = ["사과", "바나나", "포도", "망고", "수박"];
        fruits.forEach((item, index) => {
            console.log(item, index);
            list.innerHTML += `<li>${index+1}.${item}</li>`
        });
    </script>
</body>
</html>
