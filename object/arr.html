<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array 객체</title>
</head>
<body>
    <script>
        // Array 여러 데이터를 순서대로 관리
        const arr = [1, 2, 3, 4, 5];
        
        // 1. length 속성
        console.log(arr.length);

        // 2. push() : 배열 끝 요소를 추가하는 메서드
        arr.push(8);

        // 3. pop() : 배열 끝 요소를 제거하는 메서드
        arr.pop();

        // 4. shift() : 배열 첫 요소 제거
        arr.shift();

        // 5. unshift() : 배열 앞에 요소 추가하는 메서드
        arr.unshift(7);

        // 6. indexOf() : 요소 위치 반환 (index번호)
        console.log(arr.indexOf(3));

        // 7. slice() : 배열 일부 반환
        console.log(arr.slice(1, 3));

        // 8. splice() : 배열 요소 추가 / 삭제
        // splice(시작인덱스 (어디서 부터), 삭제 개수,  추가할 값1, 추가할 값2 ...)

        // 9. join() : 배열을 문자열로 변환
        console.log(arr.join("****"));

        // 10. forEach() : 각 요소에 대해 함수 실행
        arr.forEach((a)=>{
            document.write(`<p>${a}</p>`)
        })


    </script>
</body>
</html>
