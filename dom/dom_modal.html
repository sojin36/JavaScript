<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .modal{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* display: flex; */
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
        }
        .modal-content{
            background-color: #fff;
            width: 300px;
            padding: 30px;
            border-radius: 20px;
            position: relative;
        }
        .closeBtn{
            position: absolute;
            top: -26px;
            right: 16px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- 모달창 -->
    <!-- 모달 열기 버튼 -->
    <button class="openBtn">모달 열기</button>
    <!-- 모달창 -->
    <div class="modal">
        <div class="modal-content">
            <span class="closeBtn">X</span>
            <h2>모달창</h2>
            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Ipsum, dolorem. Neque, aliquam vel. Et distinctio mollitia, consequuntur natus, autem expedita eum, 
                nesciunt quo similique nulla accusamus. Ducimus sed nemo voluptates?
            </p>

        </div>
    </div>
    <script>
        const openBtn = document.querySelector(".openBtn")
        const modal = document.querySelector(".modal");
        const closeBtn = document.querySelector(".closeBtn");

        //모달 열기
        openBtn.addEventListener("click", ()=>{
            modal.style.display = "flex";
        });

        //모달 닫기
        closeBtn.addEventListener("click", ()=>{
            modal.style.display = "none";
        })

        //배경 클릭시 모달 닫기
        modal.addEventListener("click", (e)=>{
            // e.target.style.display = "none";
            if(e.target === modal){
                e.target.style.display = "none";
            }
        })
    </script>
</body>
</html>
