<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button id="skyBtn" onclick="changeColor('skyblue')">하늘색</button>
    <button id="pink" onclick="changeColor('pink')">핑크색</button>
    <button id="purple" onclick="changeColor('purple')">보라색</button>
    <button id="green" onclick="changeColor('green')">연두색</button>
    <script>
      //   색변경 함수
      function changeColor(color) {
        document.body.style.backgroundColor = color;
      }
    </script>
  </body>
</html>
