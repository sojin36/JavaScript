<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세보기 예제</title>
    <link rel="stylesheet" href="css/class.css">
    <script src="js/class.js" defer></script>
</head>
<body>
    <div class="contain">
        <img src="images/KakaoTalk_261016_101013.jpg" alt="꽃">
        <button class="over" id="open">상세 설명 보기</button>
        <!-- 상세 설명 보기 내용 -->
        <div class="detail" id="detail">
            <h4>등심붗꽃</h4>
            <p>
            북아메리카 원산으로 각지에서 관상초로 흔히 심고 있는 귀화식물이다.
            길가나 잔디밭에서 흔히 볼 수 있다. 아주 작은 씨앗을 무수히 많이 가지고
            있는데 바람을 이용해 씨앗들을 날려보내거나, 뿌리줄기를 통해 동일한
            개체들을 많이 만들어 냄으로써 번식한다.
            </p>
            <button class="over" id="close">상세 설명 닫기</button>

        </div>
    </div>
</body>
</html>
