<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    // 함수 : 동작해야 할 기능을 묶은 명령
    // alret() : 자바스크립트에 포함되어 있는 여러 함수 중 하나 => 내장함수
    // 내가 만드는 함수
    // 두 수를 더하는 함수
    // (a,b,c,d) 매개변수 : 함수가 값을 전달하는 변수
    function addNum(a,b){
        // 실행 코드
        let sum = a+b;
        document.write(`${sum}<br>`)
    }
    addNum(1,10); // 인수 : 함수 호출 할 때 전달하는 실제 값
    addNum(2,20);
    addNum(3,50);
    </script>
</body>
</html>
